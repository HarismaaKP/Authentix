<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Authentix — Product Authenticity Verification{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% block head %}{% endblock %}
</head>
<body>

<header class="topbar">
  <a href="{{ url_for('home') }}" class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26">
        <path d="M16 2 L28 8 V17 C28 24 22.5 28.5 16 30 C9.5 28.5 4 24 4 17 V8 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M11 16.2 L14.4 19.6 L21.5 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="brand-word">Authentix</span>
  </a>
  <nav class="topnav">
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('manufacturer_page') }}">Register a product</a>
    <a href="{{ url_for('verify_landing') }}">Verify a product</a>
  </nav>
  <a href="{{ url_for('verify_landing') }}" class="btn btn-primary btn-sm nav-cta">Scan QR</a>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <span>Authentix — blockchain-verified product authenticity</span>
    <span class="footer-chain-status" id="footerChainStatus">checking ledger…</span>
  </div>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
